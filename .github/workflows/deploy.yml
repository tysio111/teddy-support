name: Deploy

# Deploys main to the EC2 host on demand (Actions > Deploy > Run workflow).
# Infrastructure: infra/.
# Repository variables (Settings > Secrets and variables > Actions > Variables),
# all from `terraform output`:
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY_URL, DEPLOY_BUCKET, INSTANCE_ID
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # The host is Graviton (arm64): build natively on an arm runner.
    runs-on: ubuntu-24.04-arm
    env:
      SHA: ${{ github.sha }}

    steps:
      - name: Only deploy main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploy only from main (got $GITHUB_REF)"
          exit 1

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SHA }}

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY_URL }}:${{ env.SHA }}
            ${{ vars.ECR_REPOSITORY_URL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload deploy bundle
        run: aws s3 sync deploy/ "s3://${{ vars.DEPLOY_BUCKET }}/deploy/" --delete

      - name: Deploy on the host
        run: |
          set -euo pipefail
          # No --delete on the host: it keeps .env.prod and the tag files.
          commands=$(jq -cn --arg bucket "${{ vars.DEPLOY_BUCKET }}" --arg sha "$SHA" '[
            "set -euo pipefail",
            "aws s3 sync s3://\($bucket)/deploy/ /opt/teddy-support/",
            "chmod +x /opt/teddy-support/*.sh",
            "/opt/teddy-support/deploy.sh \($sha)"
          ]')
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SHA" \
            --timeout-seconds 900 \
            --parameters "{\"commands\":$commands,\"executionTimeout\":[\"900\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "${{ vars.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          [ "$status" = "Success" ]
